manifestVersion: 1
id: telegrapho
storage:
  dataRoot: data
category: networking
name: Telegrapho
version: "1.0.1-patch.1"
tagline: Private copy and paste between your devices
description: >-
  Stop pasting sensitive text into third-party apps.


  Telegrapho creates private realtime text channels between your devices using your self-hosted server.


  Copy on mobile and receive instantly on desktop.


  Your text. Your server. Your control.
releaseNotes: >-
  The welcome screen now appears only once per Telegrapho installation on Umbrel, rather than once per browser.
  Fixes channel-name editing so the field does not revert to the current channel while being cleared or changed.
  Saves the one-time welcome flag in persistent Umbrel app storage.

