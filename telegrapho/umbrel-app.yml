releaseNotes: >-
  The welcome screen now appears only once per Telegrapho installation on Umbrel, rather than once per browser.
  Fixes channel-name editing so the field does not revert to the current channel while being cleared or changed.
  Saves the one-time welcome flag in persistent Umbrel app storage.
