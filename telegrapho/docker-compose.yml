version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: telegrapho_app_1
      APP_PORT: 3712

  app:
    image: ghcr.io/wg2kwf9fnz-wq/telegrapho:1.0.1-patch.1@sha256:01cf37e89cc344d74d06d74d79339af501bc01f88b3ca4f36b73a7ba5ea390e2
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3712
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
