version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: telegrapho_app_1
      APP_PORT: 3712

  app:
    image: ghcr.io/wg2kwf9fnz-wq/telegrapho:1.0.1-patch.1@sha256:4da824656eea73e9b6bfd25370ff2af583ba45b081a56145f905b336dd5fb2fe
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3712
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
