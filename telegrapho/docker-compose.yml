version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: telegrapho_app_1
      APP_PORT: 3712

  app:
    image: ghcr.io/wg2kwf9fnz-wq/telegrapho:1.0.1-patch.1@sha256:7bea74dce532794263e4b0685d84eb1398ca3424d4b078b19094667658b978e6
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3712
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
